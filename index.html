<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Resham Ghali</title>
    <!-- 100% Working Online Font Awesome Icons Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel='stylesheet' href='main.css'>
    <style>
        /* Modern CSS Reset & Professional Font Stack */
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Color Palette matching your selected screenshot theme */
        body{
            background-color: #1d3b60;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* NAVBAR - Kept Exactly Same as your provided version */
        .nav-bar{
            width: 90%;
            height: 4.5rem;
            z-index: 100;
            top: 1%;
            margin-left: 5.50%;
            position: fixed;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 12px;
            background-color: rgba(20, 42, 70, 0.423); 
            border: 1px solid #ffffffa6;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            backdrop-filter: blur(2px);
            padding: 0 15px;
        }

        .nav-bar ul{
            gap: 15px;
            display: flex;
            list-style: none;
            align-items: center;
        }

        .nav-bar ul li a button{
            width: 7.5rem; /* Width thoda badhaya taaki icons aaram se fit hon */
            height: 2.8rem;
            font-size: 16px;
            cursor: pointer;
            color: #d1dbe5;
            font-weight: 500;
            border-radius: 8px;
            background-color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.274);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Nav icons ke bich spacing */
        .nav-bar ul li a button i {
            margin-right: 6px;
        }

        .nav-bar ul li a {
            text-decoration: none;
        }

        .nav-bar ul li a button:hover{
            box-shadow: 0 0 3px rgba(255, 255, 255, 0.4);
            color: #ffffff;
        }

        .nav-bar ul li a button:active{
            color: #1d3b60;
            background-color: #ffffff;
            transform: scale(0.95);
        }

        .search{
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search input{
            width: 18rem;
            height: 2.8rem;
            color: #ffffff;
            padding: 0 15px;
            font-size: 15px;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
        }
        
        .search input:focus{
            outline: none;
            border-color: #ffffff;
        }

        .search button{
            height: 2.8rem;
            padding: 0 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: #d4d3d3;
            border-radius: 8px;
            background-color: transparent; 
            border: 1px solid #ffffff78;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search button i {
            margin-right: 6px;
        }

        .search button:hover{
            color: rgb(233, 233, 233);
            box-shadow: 0 0 3px rgba(255, 255, 255, 0.4);
        }
        
        .search button:active{
            transform: scale(0.95);
        }

        /* NEW HERO SECTION */
        .hero-section {
            width: 100%;
            height: 44rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            margin-top: 2rem;
        }

        .hero-title {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 1px;
            line-height: 1.2;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .hero-subtitle {
            font-size: 20px;
            color: #d1dbe5;
            max-width: 600px;
            margin-bottom: 35px;
            font-weight: 400;
        }

        /* Hero buttons */
        .cta-buttons-container {
            display: flex;
            gap: 20px;
        }

        .cta-btn {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cta-btn i {
            margin-right: 8px;
        }

        .cta-primary {
            background-color: #ffffff;
            color: #1d3b60;
            border: 2px solid #ffffff;
            transition: 1s;
        }

        .cta-primary:hover {
            background-color: transparent;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .cta-secondary {
            background-color: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
            transition: 1s;
        }

        .cta-secondary:hover {
            background-color: #ffffff;
            color: #1d3b60;
        }

        @media (max-width: 768px) {
            .hero-title { font-size: 32px; }
            .hero-subtitle { font-size: 16px; }
            .cta-buttons-container { flex-direction: column; gap: 15px; width: 100%; max-width: 300px; }
            .cta-btn { width: 100%; }
        }
        
        @media (max-width: 368px) {
            .nav-bar{width: 100%; height: 7rem; border: none; border-bottom: 1px solid rgba(255, 255, 255, 0.566); padding: 0px 5px 50px;  border-radius: 0%; margin-left: 0px;}
            .nav-bar ul{ gap: 4px;}
            .nav-bar ul li a button{ width: 5.40rem; height: 3rem; font-size: 15px;}
            .nav-bar ul li a button i { font-size: 12px; }
            .search {position: fixed; top: 53.50%; gap: 4px;}
            .search input{width: 16.60rem; height: 2.8rem;}
            .search button{width: 5.50rem; font-size: 15px;}
            .search button i{font-size: 12px;}
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <ul>
            <li><a href="index.html"><button><i class="fa-solid fa-house"></i>Home</button></a></li>
            <li><a href="About.html"><button><i class="fa-solid fa-circle-info"></i>About</button></a></li>
            <li><a href="#"><button><i class="fa-solid fa-tag"></i>Branded</button></a></li>
            <li><a href="#"><button><i class="fa-solid fa-arrows-rotate"></i>Update</button></a></li>
        </ul>
        <div class="search">
            <input type="search" placeholder="Type here to search...">
            <button><i class="fa-solid fa-magnifying-glass"></i>Search</button>
        </div>
    </div>

    <!-- Hero Content Area -->
    <div class="hero-section">
        <h2 class="hero-title">Discover Your Favourite Outfit</h2>
        <p class="hero-subtitle">Explore our premium collection of luxury fragrances crafted to define your personality and leave an unforgettable impression.</p>
        
        <div class="cta-buttons-container">
            <button class="cta-btn cta-secondary" onclick="location.href='#'"><i class="fa-solid fa-person"></i>Men's Shop</button>
            <button class="cta-btn cta-secondary" onclick="location.href='old_brand.html'"><i class="fa-solid fa-person-dress"></i>Women's Shop</button>
        </div>
    </div>

</body>
</html>
